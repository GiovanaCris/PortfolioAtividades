<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 07</title>
</head>
<body>
    <h2>Conversor de cédulas</h2>
    <input type="number" id="valor_dinheiro" placeholder="Digite um valor em dinheiro: ">
    <button onclick="conversorCedulas()">Converter valor</button>

    <div id="resultado"></div>

    <style>
        html{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body{
            border: 1px solid #ccc;
            max-width: 400px;
            text-align: center;
            padding: 30px 20px 50px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: rgb(119, 0, 255);
            -webkit-text-stroke: 0.8px black;
        }

        input{
            font-style: italic;
            padding: 8px 8px;
            border-radius: 10px;
            border: none;
            border: 1px solid #ccc;
            background-color: rgb(238, 238, 238);
            width: 200px;
        }

        button{
            padding: 7px 10px;
            border-radius: 10px;
            margin-top: 15px;
            border: none;
            border: 1px solid #ccc;
            background-color: rgb(176, 146, 215);
            cursor: pointer;
        }

        button:hover{
            cursor: pointer;
            background-color: rgb(91, 30, 165);
            color: white;
            border: 1px solid #000000;
            transition: 0.5s ease;
        }

        button:focus{
            background-color: rgb(176, 146, 215);
            border: 1px solid #ccc;
            color: #000000;
        }

        #resultado{
            margin-top: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
        }
    </style>

    <script>
        const conversorCedulas = () => {
            let valorTotal = parseInt(document.getElementById('valor_dinheiro').value);
            let notas = [200, 100, 50, 20, 10, 5, 1];
            let resultado_final = '';

            for (let nota of notas) {
            let qtd = Math.floor(valorTotal / nota);
                if (qtd > 0) {
                    resultado_final += `${qtd} nota(s) de R$${nota}  `
                    valorTotal %= nota;
                }
            }
            document.getElementById('resultado').innerHTML = resultado_final;
        };
    </script>
</body>
</html>
