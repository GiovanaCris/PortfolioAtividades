<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05</title>
</head>
<body>
   <h2>Números em Ordem Crescente</h2>
   <input type="text" id="numeros" placeholder="Digite 3 números:">
   <button onclick="pegarnum()">Usar números</button>

   <div id="resultado"></div>

   <style>
        html{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body{
            border: 1px solid #ccc;
            max-width: 400px;
            text-align: center;
            padding: 30px 20px 50px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2{
            font-family: sans-serif;
            background: linear-gradient(to bottom left, #230546, #77648e36);
            background-clip: text;
            color: transparent;
        }

        input{
            font-style: italic;
            padding: 8px 8px;
            border-radius: 10px;
            border: none;
            background-color: rgb(238, 238, 238);
            width: 200px;
        }

        button{
            padding: 5px 5px;
            border-radius: 10px;
            margin-top: 15px;
            border: none;
            border: 1px solid #ccc;
            background-color: #77648e36;
        }

        button:hover{
            cursor: pointer;
            background-color: #75608d;
            transition: 0.5s ease;
        }

        #resultado{
            margin-top: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
   </style>

  <script>
    const pegarnum = () => {
        let valor = document.getElementById('numeros').value;
        
        let numeros = valor.split(',').map(n => Number(n.trim())); //Split: divide por vírgulas, Map: transforma cada item do array, Trim: Remove espaços em branco do começo e do fim

        if (numeros.length != 3) {
            alert("Digite os extamente 3 números com vírgula!");
            return;
        }

        let aux;
        for (let n = 0; n < numeros.length - 1; n++){
            for(let i = 0; i < numeros.length - 1; i++){
                if (numeros[i] > numeros[i + 1]) {
                    aux = numeros[i];
                    numeros[i] = numeros[i + 1];
                    numeros [i + 1] = aux;
                }
        }   }
        document.getElementById('resultado').innerHTML = `Os números em ordem crescente são: ${numeros.join(', ')}`;
    };
  </script>

</body>
</html>
